name: formatter

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10.6]
    steps:
      - name: checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format libxml2-utils
          python -m pip install --upgrade pip
          pip install autoflake autopep8 isort
      - name: format changed files and verify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          mapfile -d '' changed_files < <(git diff --name-only -z "$BASE_SHA...HEAD")

          for file in "${changed_files[@]}"; do
            [[ -f "$file" ]] || continue

            case "$file" in
              *.cpp|*.hpp|*.h)
                clang-format -i -style=file "$file"
                ;;
              *.py)
                autoflake --in-place --remove-all-unused-imports "$file"
                autopep8 --in-place "$file"
                isort "$file"
                ;;
              *.xml|*.gazebo|*.xacro|*.urdf|*.sdf)
                xmllint --noout "$file"
                ;;
            esac
          done

          if ((${#changed_files[@]})); then
            if ! git diff --exit-code -- "${changed_files[@]}"; then
              echo "::error::Formatting changes are required. Apply the diff above and push the corrected files."
              exit 1
            fi
          fi
